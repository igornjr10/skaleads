name: CI

on:
  pull_request:
  push:
    branches: [fix/whatsapp-connection-ui]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  # O lint nao bloqueia ainda: sao 85 erros pre-existentes, quase todos
  # no-explicit-any. Fica visivel no PR para ir baixando o numero em vez de
  # travar todo mundo de uma vez.
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
